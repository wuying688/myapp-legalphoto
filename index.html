<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Official legal information for Photo Grid. Read the privacy policy for the iPhone and iPad collage app.">
  <title>Photo Grid Legal</title>
  <style>
    :root { color-scheme: light; font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #192326; background: #f5f7f6; }
    body { min-height: 100vh; box-sizing: border-box; display: grid; place-items: center; margin: 0; padding: 24px; }
    main { width: min(100%, 600px); box-sizing: border-box; padding: 36px; border: 1px solid #e2e9e7; border-radius: 22px; background: #fff; box-shadow: 0 18px 60px #19332b12; }
    .eyebrow { color: #087d77; font-size: .75rem; font-weight: 750; letter-spacing: .12em; text-transform: uppercase; }
    h1 { margin: 8px 0; font-size: clamp(2rem, 7vw, 3rem); line-height: 1.1; }
    p { color: #5e696b; }
    a { display: inline-flex; align-items: center; min-height: 48px; margin-top: 12px; padding: 0 18px; border-radius: 12px; color: #fff; background: #087d77; font-weight: 700; text-decoration: none; }
    a:focus-visible { outline: 3px solid #f1a35a; outline-offset: 3px; }
    @media (max-width: 480px) { main { padding: 26px 22px; } }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Photo Grid · iPhone &amp; iPad</p>
    <h1>Your moments, your privacy.</h1>
    <p>Photo Grid keeps selected photos and collage projects on your device. Read the full policy to learn how photos are handled, how projects are deleted, and what happens when you save or share a collage.</p>
    <a href="privacy.html">Read the Privacy Policy</a>
  </main>
</body>
</html>
